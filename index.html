/* gráfico de linhas antigo (meta tracejada × realizado), refeito: aceita negativos, eixo com passos redondos, buraco onde não há dado, vazio quando não há nada */
function linhas(rotulos, metas, reais, fmt, semMeta, W0 = 640) {
  const vr = (reais || []).filter(v => v != null && isFinite(v)), vm = (!semMeta && metas ? metas : []).filter(v => v != null && isFinite(v));
  if (!vr.length && !vm.length) return GC.vazio('Sem dados no período para desenhar a linha.');

  const X = i => n > 1 ? L + i * (W - L - R) / (n - 1) : (L + W - R) / 2, Y = v => T + (H - T - B) * (y1 - v) / ((y1 - y0) || 1);
  const ticks = []; for (let v = y0; v <= y1 + st / 2; v += st) ticks.push(Math.abs(v) < st / 1e6 ? 0 : v);

  const passo = Math.ceil(n / 12);
  const eixo = rotulos.map((r, i) => i % passo === 0 ? `<text x="${X(i)}" y="${H - 8}" text-anchor="${n > 1 && i === n - 1 ? 'end' : 'middle'}">${r}</text>` : '').join('');

/* cascata: o mesmo desenho da v0.154, com rótulos em até duas linhas e, na ponte, as duas pontas (resultado anterior e atual) na cor do saldo (regra 2a) */
function gcCascata({ passos, un = 'brl', pontas = false, W: W0 = 900 }) {
  const P = passos.filter((p, i) => p.tipo === 'base' || p.tipo === 'total' || Number(p.valor));
  if (P.length < 2) return GC.vazio('Sem lançamentos no período.');

  const W = W0, H = 244, L = 64, R = 12, T = 22, Bm = 48, mx = Math.max(0, ...B.map(b => Math.max(b.de, b.ate))), mn = Math.min(0, ...B.map(b => Math.min(b.de, b.ate)));
  const st = GC.passo((mx - mn) / 4 || 1), y0v = Math.floor(mn / st) * st, y1v = Math.ceil(mx / st) * st || st, y = v => T + (y1v - v) / ((y1v - y0v) || 1) * (H - T - Bm), bw = (W - L - R) / B.length;
  const ticks = []; for (let v = y0v; v <= y1v + st / 2; v += st) ticks.push(v);
  const saldo = b => b.ate >= 0 ? 'var(--s-fav)' : 'var(--s-desf)';
  const cor = b => b.tipo === 'base' ? (pontas ? saldo(b) : 'var(--accent)') : b.tipo === 'sai' || b.tipo === 'entra' ? 'var(--muted)' : saldo(b);
  const nch = Math.max(6, Math.floor(bw / 6.4));
  const linhasRot = t => { const ws = String(t).split(/\s+/), out = ['']; ws.forEach(w => { const l = out.length - 1; if (!out[l]) out[l] = w; else if ((out[l] + ' ' + w).length <= nch) out[l] += ' ' + w; else out.push(w); });
    if (out.length > 2) { out.length = 2; out[1] = out[1].slice(0, nch - 1) + '…'; } return out.map(x => x.length > nch ? x.slice(0, nch - 1) + '…' : x); };
  return `<svg class="gc" viewBox="0 0 ${W} ${H}" role="img" aria-label="Como se chega no resultado">
    ${ticks.map(v => `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" ${v === 0 ? '' : 'stroke-dasharray="2 4"'}/><text x="${L - 8}" y="${y(v) + 3.5}" text-anchor="end">${GC.fmtK(v, un)}</text>`).join('')}
    ${B.map((b, i) => { const x0 = L + i * bw + bw * .16, w = bw * .68, yt = y(Math.max(b.de, b.ate)), h = Math.max(2, Math.abs(y(b.de) - y(b.ate))), pode = !!b.no, lr = linhasRot(b.rotulo);
      return `<g${pode ? ` class="gc-clk" data-arvno="${esc(b.no)}" data-arvpar="${esc(JSON.stringify(b.par || {}))}" data-arvrot="${esc(b.rotulo)}" role="button" tabindex="0"` : ''} data-passo="${b.tipo}"><title>${esc(b.rotulo)}: ${GC.fmt(b.tipo === 'sai' ? -Math.abs(b.valor) : b.valor, un)}</title>
        <rect x="${x0}" y="${yt}" width="${w}" height="${h}" rx="3" fill="${cor(b)}" opacity="${b.tipo === 'total' || (pontas && b.tipo === 'base') ? 1 : .85}"/>
        ${i < B.length - 1 ? `<line x1="${x0 + w}" x2="${x0 + bw}" y1="${y(b.ate)}" y2="${y(b.ate)}" stroke="var(--muted)" stroke-dasharray="2 2"/>` : ''}
        <text x="${x0 + w / 2}" y="${yt - 6}" text-anchor="middle" class="gc-v">${b.tipo === 'total' || b.tipo === 'base' ? GC.fmtK(b.ate, un) : (b.tipo === 'sai' ? '−' : '+') + GC.fmtK(Math.abs(b.valor), un)}</text>
        ${lr.map((t, k) => `<text x="${x0 + w / 2}" y="${H - 28 + k * 13}" text-anchor="middle">${esc(t)}</text>`).join('')}</g>`; }).join('')}</svg>`;
}

    const contas = {};

    top.forEach(c => passos.push({ rotulo: c.rotulo, valor: Math.abs(c.imp), tipo: c.imp > 0 ? 'entra' : 'sai', no: 'fin.razao', par: c.par }));

const GR_titulo = e => ((e.querySelector(':scope > h2, :scope > summary') || {}).textContent || '').trim();

function gradeAplica(m, semTexto) {
  if (GRADE_SECOES[m.dataset.tela]) return gradeSecoes(m, semTexto);
  m.classList.remove('secoes192');
  const plano = GRADE_TELAS[m.dataset.tela]; if (!plano) return;

  plano.forEach(([sel, sp], i) => {
    const e = typeof sel === 'function' ? sel(m) : GR_itens(m).find(x => x.matches(sel));
    if (!e || usados.has(e)) return; usados.add(e);
    const n = typeof sp === 'function' ? sp(m) : sp; e.style.order = i + 1; e.style.setProperty('--sp', n); e.style.setProperty('--sp2', Math.max(6, n));
  });

}
/* gráfico desenhado para 640 de largura e mostrado em 360 encolhe o texto junto; aqui o texto volta perto do tamanho de leitura
   (até 1,5× o tamanho desenhado, para não atropelar os rótulos vizinhos). Guarda o tamanho original para recalcular. */
function gradeTextos(m) {
  m.querySelectorAll('svg[viewBox]').forEach(svg => {
    if (svg.closest('.kpi') || svg.classList.contains('spk')) return;
    const vb = svg.viewBox && svg.viewBox.baseVal, w = svg.getBoundingClientRect().width;
    if (!vb || !vb.width || !w) return;
    const k = Math.min(1.5, Math.max(1, vb.width / w));
    svg.querySelectorAll('text').forEach(t => {
      if (!t.dataset.fs0) t.dataset.fs0 = parseFloat(getComputedStyle(t).fontSize) || 11;
      const novo = k > 1.02 ? (Number(t.dataset.fs0) * k).toFixed(1) + 'px' : '';
      if (t.style.fontSize !== novo) t.style.fontSize = novo;
    });
  });
}
let GR_obs = null, GR_t = null;
function gradeLiga(m, vk) {
  m.dataset.tela = vk;
  m.classList.toggle('grade158', !!(GRADE_TELAS[vk] || GRADE_SECOES[vk])); if (!GRADE_SECOES[vk]) m.classList.remove('secoes192');
  if (!GR_obs) {
    const agenda = () => { const mm = $('#main'); if (!mm || !(GRADE_TELAS[mm.dataset.tela] || GRADE_SECOES[mm.dataset.tela])) return; gradeAplica(mm, true); clearTimeout(GR_t); GR_t = setTimeout(() => gradeTextos(mm), 80); };
    GR_obs = new MutationObserver(agenda);
    GR_obs.observe(m, { childList: true, subtree: true });
    if (window.ResizeObserver) new ResizeObserver(agenda).observe(m);
  }
  if (GRADE_TELAS[vk] || GRADE_SECOES[vk]) gradeAplica(m);
}
/* largura útil (px) de um bloco de sp colunas na tela em grade; fora da grade, a largura de desenho de sempre */
function gradeLarg(sp, def) {
  const m = $('#main'); if (!m || !m.classList.contains('grade158') || !m.clientWidth) return def;
  const vw = window.innerWidth; if (vw <= 760) sp = 12; else if (vw <= 1100) sp = Math.max(6, sp);
  const W0 = m.clientWidth - (m.classList.contains('secoes192') ? 44 : 0), col = (W0 - 11 * 16) / 12;
  return Math.max(300, Math.round(col * sp + 16 * (sp - 1) - 40));
}

async function tabProducao(el, D, C) {

  let V = [];
  try { V = await q(sb.from('content_versoes').select('conteudo_id,status').eq('workspace_id', S.ws)); } catch (e) { return ctSemBanco(el, 'Produção'); }
  const nV = id => V.filter(v => v.conteudo_id === id).length, aj = id => V.some(v => v.conteudo_id === id && v.status === 'ajuste_pedido');
  const col = ([st, nome, sub]) => { const L = D.cont.filter(c => c.status === st); return `<div class="ct-col"><div class="ct-col-h"><b>${nome}</b> <span class="muted">${L.length}${sub ? ' · ' + sub : ''}</span></div>${L.length ? L.map(c => `<button class="ct-card" data-id="${c.id}" type="button"><b>${esc(c.titulo)}</b><span class="muted">${esc(FORM_N[c.formato] || c.formato || '')}${c.prazo ? ' · até ' + dd(c.prazo) : ''}${c.data_publicacao ? ' · publica ' + dd(c.data_publicacao) : ''}</span>${c.roteiro_aprovado_em ? '<span class="pill sem-p sem-p-fav">✓ roteiro</span>' : c.roteiro ? '<span class="pill">roteiro em rascunho</span>' : ''}${nV(c.id) ? `<span class="pill">${nV(c.id)} versão(ões)</span>` : ''}${aj(c.id) ? '<span class="pill sem-p sem-p-aten">⚠ ajuste pedido</span>' : ''}</button>`).join('') : '<div class="muted ct-vazio">—</div>'}</div>`; };
  el.innerHTML = `<div class="panel ct-intro"><p><b>Como funciona:</b> cada peça passa por Roteiro (você aprova o texto), Peça (a arte ou o vídeo, com versões e pedidos de ajuste), Aprovada e Agendada. Clique numa peça para abrir.</p></div><div class="ct-quadro">${CT_ETAPAS_P.map(col).join('')}</div>`;
  el.querySelectorAll('.ct-card').forEach(b => b.onclick = () => { C.peca = b.dataset.id; render(); });
}
async function ctPeca(el, D, C, c) {
  let V, pode;
  try { [V, pode] = await Promise.all([q(sb.from('content_versoes').select('*').eq('conteudo_id', c.id).order('criado_em', { ascending: false })), ctPode()]); }
  catch (e) { return ctSemBanco(el, 'Peça'); }
  const video = CT_VIDEO(c.formato), tipoP = video ? 'video' : 'arte', dis = pode ? '' : ' disabled', st = c.status;
  const etapa = (CT_ETAPAS_P.find(e => e[0] === st) || [st, ETAPAS_C.find(e => e[0] === st) ? ETAPAS_C.find(e => e[0] === st)[1] : st])[1];
  const roteiroOk = !!c.roteiro_aprovado_em, pecaOk = !!c.peca_aprovada_em;
  const vers = t => V.filter(v => v.tipo === t);
  const lstV = t => vers(t).length ? `<div class="tw"><table><thead><tr><th>Versão</th><th>Arquivo</th><th>Nota</th><th>Ajuste pedido</th><th>Situação</th></tr></thead><tbody>${vers(t).map(v => `<tr data-v="${v.id}"><td>${v.n}</td><td>${ctLink(v.arquivo_url) || '—'}</td><td>${esc(v.nota || '')}</td><td>${esc(v.ajuste || '')}</td><td>${{ nova: 'nova', ajuste_pedido: 'ajuste pedido', aprovada: 'aprovada', substituida: 'substituída' }[v.status]}</td></tr>`).join('')}</tbody></table></div>` : '<p class="muted">Nenhuma versão ainda.</p>';
  const ultima = t => vers(t)[0] || null;
  el.innerHTML = `<div class="acts"><button class="btn sm" id="ctVolta">← Produção</button></div>
    <div class="panel"><div class="ig-head"><div><h2 style="margin:0">${esc(c.titulo)}</h2><span class="muted">${esc(FORM_N[c.formato] || c.formato || '')} · etapa: ${esc(etapa)}${c.prazo ? ' · prazo ' + dd(c.prazo) : ''}</span></div><button class="btn sm" id="ctEdit">Dados da ideia</button></div></div>
    <div class="cols"><div class="panel"><h2>Roteiro ${roteiroOk ? '<span class="pill sem-p sem-p-fav">✓ aprovado</span>' : ''}</h2>
        ${roteiroOk ? `<p class="muted">Aprovado por ${esc(c.roteiro_aprovado_por || '')} em ${ctQuando(c.roteiro_aprovado_em)}. Mudar o texto tira a aprovação.</p>` : '<p class="muted">Aprove o roteiro antes de produzir a peça.</p>'}
        <textarea id="ctRot" rows="14"${pode && !pecaOk ? '' : ' disabled'}>${esc(c.roteiro || '')}</textarea>
        ${pode && !pecaOk ? `<div class="acts"><button class="btn" id="ctRotSalva">Salvar</button>${roteiroOk ? '' : '<button class="btn pri" id="ctRotOk">Aprovar roteiro</button>'}</div>` : ''}${pecaOk ? '' : `<div class="acts">${CT_BTN_IA('Escrever o roteiro pela Claude')}</div>`}</div>
      <div class="panel"><h2>${video ? 'Vídeo' : 'Arte'} ${pecaOk ? '<span class="pill sem-p sem-p-fav">✓ aprovada</span>' : ''}</h2>
        ${!roteiroOk ? '<div class="empty">A peça é produzida depois que o roteiro for aprovado.</div>' : `
        ${video ? `<label>Vídeo bruto (link na pasta do cliente)<input id="ctBruto" value="${esc(c.video_bruto_url || '')}" placeholder="https://drive.google.com/…"${dis}></label><div class="acts">${ctLink(c.video_bruto_url)}${pode ? '<button class="btn sm" id="ctBrutoS">Salvar link</button>' : ''}</div>
          <h3>Cortes e legenda</h3><p class="muted">A Claude transcreve, propõe os cortes e a legenda aqui; você aprova antes da edição.</p><div class="acts">${CT_BTN_IA('Propor cortes pela Claude')}</div>` : `${pecaOk ? '' : `<div class="acts">${CT_BTN_IA('Produzir a arte pela Claude')}</div>`}`}
        <h3>Versões</h3>${lstV(tipoP)}
        ${pode && !pecaOk ? `<details class="ct-nova"><summary>Registrar uma versão (arquivo já na pasta)</summary><label>Link do arquivo<input id="ctVUrl" placeholder="https://drive.google.com/…"></label><label>Nota (opcional)<input id="ctVNota"></label><div class="acts"><button class="btn" id="ctVAdd">Registrar versão</button></div></details>
          ${ultima(tipoP) ? `<label>Pedir ajuste na versão ${ultima(tipoP).n}<textarea id="ctAj" rows="2" placeholder='ex.: "troca o título", "fundo mais claro", "corta o começo"'></textarea></label><div class="acts"><button class="btn" id="ctAjS">Pedir ajuste</button><button class="btn pri" id="ctPecaOk">Aprovar ${video ? 'vídeo' : 'arte'}</button></div>` : ''}` : ''}`}
        ${video && roteiroOk ? `<h3>Capa</h3>${lstV('capa')}<div class="acts">${CT_BTN_IA('Fazer a capa pela Claude')}</div>${pode && !pecaOk ? '<details class="ct-nova"><summary>Registrar uma capa</summary><label>Link do arquivo<input id="ctCUrl" placeholder="https://drive.google.com/…"></label><div class="acts"><button class="btn" id="ctCAdd">Registrar capa</button></div></details>' : ''}` : ''}
        ${pecaOk ? `<p class="muted">Aprovada por ${esc(c.peca_aprovada_por || '')} em ${ctQuando(c.peca_aprovada_em)}.</p>${st === 'pronto' && pode ? `<label>Data de publicação<input type="date" id="ctPub" value="${esc(c.data_publicacao || '')}"></label><div class="acts"><button class="btn pri" id="ctAgenda">Agendar</button></div>` : ''}${st === 'agendado' ? `<p>Agendada para <b>${dd(c.data_publicacao)}</b>.</p>` : ''}` : ''}
      </div></div>`;
  el.querySelector('#ctVolta').onclick = () => { C.peca = null; render(); };
  el.querySelector('#ctEdit').onclick = () => modalConteudo(c, D);
  if (!pode) return;
  const up = (o, msg) => act(async () => { await q(sb.from('conteudos').update(o).eq('id', c.id)); toast(msg); render(); });
  const rot = () => el.querySelector('#ctRot').value;
  if (el.querySelector('#ctRotSalva')) el.querySelector('#ctRotSalva').onclick = () => { const mudou = rot() !== (c.roteiro || ''); up({ roteiro: rot(), ...(mudou && roteiroOk ? { roteiro_aprovado_em: null, roteiro_aprovado_por: null, status: 'pauta' } : {}) }, mudou && roteiroOk ? 'Roteiro salvo; precisa de nova aprovação.' : 'Roteiro salvo.'); };
  if (el.querySelector('#ctRotOk')) el.querySelector('#ctRotOk').onclick = () => { if (!rot().trim()) return toast('Escreva o roteiro antes de aprovar.', true); up({ roteiro: rot(), roteiro_aprovado_em: new Date().toISOString(), roteiro_aprovado_por: ctQuem(), status: ['pauta', 'ideia'].includes(st) ? 'producao' : st }, 'Roteiro aprovado: a peça pode ser produzida.'); };
  const b = s => el.querySelector(s);
  if (b('#ctBrutoS')) b('#ctBrutoS').onclick = () => { const u = b('#ctBruto').value.trim(); if (u && !/^https?:\/\//.test(u)) return toast('O link precisa começar com https://', true); up({ video_bruto_url: u || null }, 'Link do vídeo salvo.'); };
  const addV = (tipo, url, nota) => act(async () => {
    if (!/^https?:\/\//.test(url)) throw new Error('Cole o link do arquivo na pasta (começa com https://).');
    const n = (vers(tipo)[0] ? vers(tipo)[0].n : 0) + 1;
    if (vers(tipo)[0] && vers(tipo)[0].status !== 'substituida') await q(sb.from('content_versoes').update({ status: 'substituida', atualizado_em: new Date().toISOString() }).eq('id', vers(tipo)[0].id));
    await q(sb.from('content_versoes').insert({ workspace_id: S.ws, conteudo_id: c.id, n, tipo, arquivo_url: url, nota: nota || null, criado_por: ctQuem() }));
    toast(`Versão ${n} registrada.`); render();
  });
  if (b('#ctVAdd')) b('#ctVAdd').onclick = () => addV(tipoP, b('#ctVUrl').value.trim(), b('#ctVNota').value.trim());
  if (b('#ctCAdd')) b('#ctCAdd').onclick = () => addV('capa', b('#ctCUrl').value.trim(), '');
  if (b('#ctAjS')) b('#ctAjS').onclick = () => act(async () => { const t = b('#ctAj').value.trim(); if (!t) throw new Error('Escreva o ajuste que você quer.'); await q(sb.from('content_versoes').update({ ajuste: t, status: 'ajuste_pedido', atualizado_em: new Date().toISOString() }).eq('id', ultima(tipoP).id)); toast('Ajuste registrado na versão ' + ultima(tipoP).n + '.'); render(); });
  if (b('#ctPecaOk')) b('#ctPecaOk').onclick = () => act(async () => {
    await q(sb.from('content_versoes').update({ status: 'aprovada', atualizado_em: new Date().toISOString() }).eq('id', ultima(tipoP).id));
    await q(sb.from('conteudos').update({ peca_aprovada_em: new Date().toISOString(), peca_aprovada_por: ctQuem(), status: 'pronto', midia_url: ultima(tipoP).arquivo_url }).eq('id', c.id));
    toast((video ? 'Vídeo' : 'Arte') + ' aprovada: pronta para agendar.'); render();
  });
  if (b('#ctAgenda')) b('#ctAgenda').onclick = () => { const d = b('#ctPub').value; if (!d) return toast('Escolha a data de publicação.', true); up({ data_publicacao: d, status: 'agendado' }, 'Agendada para ' + dd(d) + '.'); };
}

/* ---------- 5. Mais ferramentas: as abas de antes ---------- */
function tabMais(el, D, C) {

/* ================= v0.160 — Growth's Content: linha editorial na configuração, subtemas e o Kanban com calendário na Produção =================
   Pedido da Rebecka (26/10): manter o Kanban com as datas e o calendário que já existiam (é ali que ela vê o que publica quando),
   com os conteúdos aprovados e os pendentes de aprovação; a aprovação de roteiro e peça da v0.159 fica e passa a abrir de dentro do Kanban.
   A configuração inicial ganha a linha editorial (linhas, temas, subtemas e formatos), para cada conteúdo nascer segmentado e os relatórios
   saírem por linha, tema, subtema e formato. Ideia aprovada pede tema, formato e data de publicação: entra no Kanban já no calendário. */
const ehSimples = D => !D.cfg.metodo || D.cfg.metodo === 'simples';
const CT_SUB_SIMPLES = { ideia: 'aprovar em Ideias', pauta: 'roteiro a aprovar', producao: 'peça a aprovar', pronto: 'aprovada, a agendar', agendado: 'no calendário', publicado: '' };
const subtemasDe = (D, temaId, atual) => (D.subtemas || []).filter(s => s.tema_pai_id === temaId && (s.ativo || s.id === atual));
function mqOptSub(D, temaId, atual) {
  const L = subtemasDe(D, temaId, atual);
  return `<option value="">${temaId ? (L.length ? '— (opcional)' : 'Este tema não tem subtemas') : 'Escolha o tema primeiro'}</option>${L.map(s => `<option value="${s.id}"${s.id === atual ? ' selected' : ''}>${esc(s.nome)}</option>`).join('')}`;
}
/* liga o select de subtema ao de tema dentro de um formulário */
function mqLigaSub(f, D) {
  const t = f.elements.tema_id, s = f.elements.subtema_id; if (!t || !s) return;
  t.addEventListener('change', () => { s.innerHTML = mqOptSub(D, t.value, null); });
}

/* ---------- Produção = o Kanban de sempre (painel, calendário, colunas), com a aprovação ---------- */
async function tabProducao160(el, D, C) {
  if (C.peca) { const c = D.cont.find(x => x.id === C.peca); if (c) return ctPeca(el, D, C, c); C.peca = null; }
  tabKanban(el, D, C);
  el.insertAdjacentHTML('afterbegin', `<div class="panel ct-intro"><p><b>Como funciona:</b> as ideias aprovadas entram aqui com tema, formato e data, e aparecem no calendário. Cada conteúdo passa por roteiro a aprovar, peça a aprovar, aprovada, agendada e publicada. Em cada cartão, <b>Roteiro e peça</b> abre a aprovação; <b>Abrir</b> mostra todos os dados.</p></div>`);
  let V = []; try { V = await q(sb.from('content_versoes').select('conteudo_id,status').eq('workspace_id', S.ws)); } catch (e) { V = []; }
  const ajuste = new Set(V.filter(v => v.status === 'ajuste_pedido').map(v => v.conteudo_id));
  el.querySelectorAll('.gcard[data-id]').forEach(card => {
    const c = D.cont.find(x => x.id === card.dataset.id); if (!c || card.querySelector('.ct-apr')) return;
    const st = c.status, pills = [];
    if (c.subtema_id && D.T[c.subtema_id]) pills.push(`<span class="pill neutral" title="Subtema">↳ ${esc(D.T[c.subtema_id].nome)}</span>`);
    if (['pauta', 'producao', 'pronto', 'agendado', 'publicado'].includes(st)) pills.push(c.roteiro_aprovado_em ? '<span class="pill sem-p sem-p-fav">✓ roteiro</span>' : '<span class="pill sem-p sem-p-aten">⚠ roteiro a aprovar</span>');
    if (['producao', 'pronto', 'agendado', 'publicado'].includes(st)) pills.push(c.peca_aprovada_em ? '<span class="pill sem-p sem-p-fav">✓ peça</span>' : ajuste.has(c.id) ? '<span class="pill sem-p sem-p-aten">⚠ ajuste pedido</span>' : '<span class="pill sem-p sem-p-aten">⚠ peça a aprovar</span>');
    if (pills.length) card.querySelector('b').insertAdjacentHTML('afterend', `<div class="ca ct-apr">${pills.join('')}</div>`);
    if (st !== 'ideia' && st !== 'arquivado') {
      const acts = [...card.querySelectorAll('.ca')].pop();
      if (acts) { acts.insertAdjacentHTML('afterbegin', `<button class="btn sm pri" data-peca="${c.id}" type="button">Roteiro e peça</button>`); acts.querySelector('[data-peca]').onclick = () => { C.peca = c.id; render(); }; }
    }
  });
}

/* ---------- Ideias: aprovar pede tema, subtema, formato e data ---------- */
function modalAprovaIdeia(c, D) {
  const fmtOpts = D.fmts.filter(f => f.ativo || f.id === c.formato_id);
  const f = modal('Aprovar ideia', `<p class="muted" style="margin:0 0 8px"><b>${esc(c.titulo)}</b><br>Com tema, formato e data, o conteúdo entra no Kanban e no calendário já segmentado para os relatórios.</p><div class="grid2">
    <label>Linha e tema<select name="tema_id" required>${mqOptTemas(D, c.tema_id)}</select></label>
    <label>Subtema<select name="subtema_id">${mqOptSub(D, c.tema_id, c.subtema_id)}</select></label>
    ${fmtOpts.length ? `<label>Formato<select name="formato_id"><option value="">—</option>${fmtOpts.map(x => `<option value="${x.id}"${x.id === c.formato_id ? ' selected' : ''}>${esc(x.nome)}</option>`).join('')}</select></label>` : ''}
    <label>Tipo de mídia<select name="formato" required>${FORM_C.map(([k, l]) => `<option value="${k}"${(c.formato || 'carrossel') === k ? ' selected' : ''}>${l}</option>`).join('')}</select></label>
    <label>Prazo de produção<input type="date" name="prazo" value="${esc(c.prazo || '')}"></label>
    <label>Data de publicação<input type="date" name="data_publicacao" required value="${esc(c.data_publicacao || '')}"></label></div>`, async (d) => {
    if (!d.tema_id) throw new Error('Escolha o tema.');
    if (!d.data_publicacao) throw new Error('Informe a data de publicação: é ela que põe o conteúdo no calendário.');
    if (d.prazo && d.prazo > d.data_publicacao) throw new Error('O prazo de produção fica antes da data de publicação.');
    const v = { tema_id: d.tema_id, subtema_id: d.subtema_id || null, formato: d.formato, prazo: d.prazo || null, data_publicacao: d.data_publicacao, status: 'pauta' };
    if (fmtOpts.length) v.formato_id = d.formato_id || null;
    await q(sb.from('conteudos').update(v).eq('id', c.id));
    await sincPubs(c.id, { ...c, ...v });
    toast('Ideia aprovada: está no Kanban em ' + dd(d.data_publicacao) + '.');
  }, 'Aprovar');
  mqLigaSub(f, D);
}

/* ---------- Linha editorial: a tela de antes + subtemas + conteúdos por segmento ---------- */
function tabLinhas160(el, D, C) {
  tabLinhas(el, D, C);
  const temas = D.temas.filter(t => !t.transversal && (t.ativo || subtemasDe(D, t.id).length));
  const vivo = D.cont.filter(c => c.status !== 'arquivado');
  const conta = X => ({ ideia: X.filter(c => c.status === 'ideia').length, prod: X.filter(c => ['pauta', 'producao', 'pronto'].includes(c.status)).length, agend: X.filter(c => c.status === 'agendado').length, pub: X.filter(c => c.status === 'publicado').length, tot: X.length });
  const celulas = n => `<td class="n">${n.ideia}</td><td class="n">${n.prod}</td><td class="n">${n.agend}</td><td class="n">${n.pub}</td><td class="n"><b>${n.tot}</b></td>`;
  const linhasSeg = [];
  const porLinha = [...D.linhas, { id: null, nome: 'Sem linha' }];
  porLinha.forEach(l => {
    const ts = temas.filter(t => (l.id ? t.linha_id === l.id : (!t.linha_id || !D.L[t.linha_id])));
    ts.forEach(t => {
      const X = vivo.filter(c => c.tema_id === t.id);
      linhasSeg.push(`<tr class="ct-seg-t"><td>${l.id ? pillTerr(l) : '<span class="muted">—</span>'}</td><td><b>${esc(t.nome)}</b></td><td></td>${celulas(conta(X))}</tr>`);
      subtemasDe(D, t.id).forEach(s => { linhasSeg.push(`<tr><td></td><td></td><td>↳ ${esc(s.nome)}</td>${celulas(conta(X.filter(c => c.subtema_id === s.id)))}</tr>`); });
      const semSub = X.filter(c => !c.subtema_id); if (subtemasDe(D, t.id).length && semSub.length) linhasSeg.push(`<tr><td></td><td></td><td class="muted">sem subtema</td>${celulas(conta(semSub))}</tr>`);
    });
  });
  const semTema = vivo.filter(c => !c.tema_id);
  const fmtLinhas = [...D.fmts.filter(f => f.ativo).map(f => [f.nome, vivo.filter(c => c.formato_id === f.id)]), ...FORM_C.map(([k, n]) => [n + ' (tipo de mídia)', vivo.filter(c => c.formato === k)])].filter(([, X]) => X.length);
  el.insertAdjacentHTML('beforeend', `<div class="panel" id="ctSubtemas"><div class="ig-head"><div><h2 style="margin:0">Subtemas</h2><span class="muted">Opcional. Um nível abaixo do tema, para segmentar mais os conteúdos e os relatórios. Cada nome é único neste cliente.</span></div></div>
      ${temas.length ? `<div class="tw"><table><thead><tr><th>Linha</th><th>Tema</th><th>Subtemas</th><th></th></tr></thead><tbody>${temas.map(t => `<tr><td>${t.linha_id && D.L[t.linha_id] ? pillTerr(D.L[t.linha_id]) : '—'}</td><td><b>${esc(t.nome)}</b></td><td>${subtemasDe(D, t.id).map(s => `<span class="chip">${esc(s.nome)}</span>`).join(' ') || '<span class="muted">nenhum</span>'}</td><td><button class="btn sm" data-sub="${t.id}" type="button">Editar subtemas</button></td></tr>`).join('')}</tbody></table></div>` : '<p class="muted">Cadastre os temas acima; depois os subtemas aparecem aqui.</p>'}</div>
    <div class="panel" id="ctSeg"><h2>Conteúdos por linha, tema e subtema</h2><span class="muted">Fora os arquivados. Em produção = roteiro, peça ou aprovada esperando data.</span>
      <div class="tw"><table><thead><tr><th>Linha</th><th>Tema</th><th>Subtema</th><th class="n">Ideias</th><th class="n">Em produção</th><th class="n">Agendados</th><th class="n">Publicados</th><th class="n">Total</th></tr></thead><tbody>${linhasSeg.join('')}${semTema.length ? `<tr><td colspan="3" class="muted">Sem tema</td>${celulas(conta(semTema))}</tr>` : ''}</tbody></table></div>
      ${fmtLinhas.length ? `<h2 style="margin-top:16px">Por formato</h2><div class="tw"><table><thead><tr><th>Formato</th><th class="n">Ideias</th><th class="n">Em produção</th><th class="n">Agendados</th><th class="n">Publicados</th><th class="n">Total</th></tr></thead><tbody>${fmtLinhas.map(([n, X]) => `<tr><td>${esc(n)}</td>${celulas(conta(X))}</tr>`).join('')}</tbody></table></div>` : ''}</div>`);
  el.querySelectorAll('[data-sub]').forEach(b => b.onclick = () => modalSubtemas(D.T[b.dataset.sub], D));
}
function modalSubtemas(t, D) {
  const atuais = subtemasDe(D, t.id);
  modal('Subtemas de ' + t.nome, `<label>Um subtema por linha<textarea name="lista" rows="8" placeholder="ex.: Precificação&#10;Lançamento&#10;Perpétuo">${esc(atuais.map(s => s.nome).join('\n'))}</textarea></label><p class="muted" style="margin:6px 0 0">Tirar um nome da lista desativa o subtema; os conteúdos que já usam continuam com ele.</p>`, async d => {
    const nomes = [...new Map(String(d.lista || '').split('\n').map(x => x.trim()).filter(Boolean).map(x => [x.toLowerCase(), x])).values()];
    if (nomes.some(n => n.length > 80)) throw new Error('Cada subtema tem até 80 letras.');
    const todos = (D.subtemas || []).filter(s => s.tema_pai_id === t.id);
    for (const n of nomes) {
      const ja = todos.find(s => s.nome.toLowerCase() === n.toLowerCase());
      if (ja) { if (!ja.ativo || ja.nome !== n) await q(sb.from('conteudo_temas').update({ ativo: true, nome: n }).eq('id', ja.id)); continue; }
      const outro = [...D.temas, ...(D.subtemas || [])].find(x => x.nome.toLowerCase() === n.toLowerCase());
      if (outro) throw new Error(`"${n}" já é ${outro.tema_pai_id ? 'subtema de ' + ((D.T[outro.tema_pai_id] || {}).nome || 'outro tema') : 'um tema'} neste cliente. Use outro nome.`);
      await q(sb.from('conteudo_temas').insert({ workspace_id: S.ws, nome: n, tema_pai_id: t.id, linha_id: t.linha_id || null, prioridade: t.prioridade || 2, cor: corDe(t.cor, '#0a6b5b') }));
    }
    for (const s of todos) if (s.ativo && !nomes.some(n => n.toLowerCase() === s.nome.toLowerCase())) await q(sb.from('conteudo_temas').update({ ativo: false }).eq('id', s.id));
    toast('Subtemas salvos.'); render();
  }, 'Salvar');
}
