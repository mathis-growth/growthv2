<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Planejamento de campanha avançado</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>:root {

}

  --bg: #0E1424; --surface: #161E33; --surface-2: #1C2640; --surface-3: #3A4870; --line: #2B3756; --fg: #E6EBF7; --muted: #9AA5C2; --accent: #7FA2FF; --accent-soft: #22305A;
  --ok: #5FD39A; --ok-soft: #173A2A; --warn: #F2B35B; --warn-soft: #3E2D12; --bad: #FF8A93; --bad-soft: #43191E;
  --c-meta: #7FA2FF; --c-google: #4FD1BE; --c-org: #C49BF2; --c-api: #5FD39A; --c-asc: #8A93A8; --c-real: #E6EBF7; --c-sim: #7FA2FF; --c-alvo: #F2B35B;
  --p1: #7FA2FF; --p2: #F27FA8; --p3: #E6B84A; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0E1424; --surface: #161E33; --surface-2: #1C2640; --surface-3: #3A4870; --line: #2B3756; --fg: #E6EBF7; --muted: #9AA5C2; --accent: #7FA2FF; --accent-soft: #22305A;
  --ok: #5FD39A; --ok-soft: #173A2A; --warn: #F2B35B; --warn-soft: #3E2D12; --bad: #FF8A93; --bad-soft: #43191E;
  --c-meta: #7FA2FF; --c-google: #4FD1BE; --c-org: #C49BF2; --c-api: #5FD39A; --c-asc: #8A93A8; --c-real: #E6EBF7; --c-sim: #7FA2FF; --c-alvo: #F2B35B;
  --p1: #7FA2FF; --p2: #F27FA8; --p3: #E6B84A; color-scheme: dark }
* { box-sizing: border-box }
body { background: var(--bg); color: var(--fg); font: 15px/1.5 var(--f-ui); margin: 0 }
.wrap { max-width: 1240px; margin: 0 auto; padding-block: 20px 60px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
h1 { font-size: 26px; line-height: 1.2; margin: 0 0 4px; letter-spacing: -.01em; text-wrap: balance }
h2 { font-size: 18px; margin: 0 0 8px } h3 { font-size: 15px; margin: 14px 0 6px }
p { margin: 0 0 8px; max-width: 80ch } .muted { color: var(--muted) } .peq { font-size: 13px }
.exemplo { display: inline-block; font-size: 12px; font-weight: 600; color: var(--warn); background: var(--warn-soft); border-radius: 999px; padding: 2px 10px; margin-left: 6px; vertical-align: 3px }
.painel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 14px; min-width: 0 }
.seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface-2) }
.seg button { font: 600 13px var(--f-ui); color: var(--muted); background: none; border: 0; padding: 7px 11px; cursor: pointer; border-right: 1px solid var(--line) }
.seg button:last-child { border-right: 0 } .seg button[aria-pressed="true"] { background: var(--accent); color: var(--surface) }
select, input[type=number] { font: 13px var(--f-num); color: var(--fg); background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px }
select { font-family: var(--f-ui) } input[type=number] { width: 84px; text-align: right }
button:focus-visible, input:focus-visible, select:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.tw { overflow-x: auto }
table { border-collapse: collapse; width: 100%; font-size: 13px }
th, td { padding: 6px 7px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; vertical-align: middle }
th { font-weight: 600; color: var(--muted); font-size: 12px; vertical-align: bottom } th small { display: block; font-weight: 400 }
td.n, th.n { text-align: right } td.n { font-family: var(--f-num); font-variant-numeric: tabular-nums; font-size: 12.5px }
tr.forte td { font-weight: 700 } tr.tot td { font-weight: 700; border-top: 2px solid var(--line); border-bottom: 0 } tr.sub td { color: var(--muted) }
tr.clic { cursor: pointer } tr.clic:hover td { background: var(--surface-2) } tr.sel td { background: var(--accent-soft) }
.d { display: block; font-size: 11px; font-weight: 500 } .d.up { color: var(--ok) } .d.down { color: var(--bad) } .d.neu { color: var(--muted) }
.can { display: inline-flex; align-items: center; gap: 6px; font-weight: 600 } .can i { width: 9px; height: 9px; border-radius: 3px; display: inline-block; flex: none }
.btn { font: 600 13px var(--f-ui); color: var(--accent); background: var(--surface); border: 1px solid var(--accent); border-radius: 8px; padding: 6px 11px; cursor: pointer }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px }
.q { background: var(--surface-2); border-radius: 10px; padding: 11px 13px; border-left: 4px solid var(--line); display: flex; flex-direction: column; gap: 1px }
.q.ok { border-left-color: var(--ok) } .q.warn { border-left-color: var(--warn) } .q.bad { border-left-color: var(--bad) }
.q span { font-size: 12.5px; color: var(--muted) } .q b { font: 600 20px var(--f-num); letter-spacing: -.02em } .q small { font-size: 12px; color: var(--muted) }
.aviso { border-radius: 10px; padding: 10px 14px; margin-top: 10px; font-size: 14px }
.aviso.ok { background: var(--ok-soft); color: var(--ok) } .aviso.warn { background: var(--warn-soft); color: var(--warn) } .aviso.bad { background: var(--bad-soft); color: var(--bad) } .aviso.info { background: var(--accent-soft); color: var(--fg) }
.leg { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 12.5px; color: var(--muted); margin-top: 4px } .leg i { display: inline-block; width: 12px; height: 12px; vertical-align: -1px; margin-right: 6px; border-radius: 3px }
.leg i.ln { height: 3px; width: 16px; vertical-align: middle }
svg text { font-family: var(--f-ui) }
.st { display: inline-block; font-size: 12px; font-weight: 600; border-radius: 999px; padding: 2px 9px }
.st.ok { background: var(--ok-soft); color: var(--ok) } .st.warn { background: var(--warn-soft); color: var(--warn) } .st.bad { background: var(--bad-soft); color: var(--bad) }
/* bloco do real */
.real { border: 2px solid var(--c-real) }
.pill-real { display: inline-block; background: var(--c-real); color: var(--surface); font-weight: 700; font-size: 12.5px; border-radius: 6px; padding: 2px 9px; margin-right: 8px; vertical-align: 2px }
.real-grade { display: grid; grid-template-columns: minmax(0, 260px) minmax(0, 1fr); gap: 18px; align-items: start; margin-top: 8px }
@media (max-width: 760px) { .real-grade { grid-template-columns: minmax(0, 1fr) } }
.real-num .big { font: 600 44px/1 var(--f-num); letter-spacing: -.03em } .real-num .big small { font: 600 16px var(--f-ui); letter-spacing: 0; margin-left: 6px }
.real-num dl { display: grid; grid-template-columns: auto auto; gap: 2px 14px; margin: 10px 0 0; font-size: 13.5px } .real-num dt { color: var(--muted) } .real-num dd { margin: 0; font-family: var(--f-num); text-align: right }
.barra { display: flex; height: 16px; border-radius: 6px; overflow: hidden; margin: 8px 0 10px; background: var(--surface-2) } .barra span { display: block; height: 100% }
.comp-linha { display: grid; grid-template-columns: minmax(0, 1fr) 70px 54px 90px; gap: 8px; align-items: center; padding: 7px 8px; border-radius: 8px; font-size: 13.5px; cursor: pointer; border: 0; background: none; width: 100%; text-align: left; color: var(--fg); font-family: var(--f-ui) }
.comp-linha:hover { background: var(--surface-2) } .comp-linha .n { font-family: var(--f-num); text-align: right; font-size: 13px } .comp-linha .ir { color: var(--accent); font-size: 12.5px; font-weight: 600; text-align: right }
.comp-cab { display: grid; grid-template-columns: minmax(0, 1fr) 70px 54px 90px; gap: 8px; padding: 0 8px; font-size: 12px; color: var(--muted) } .comp-cab span:not(:first-child) { text-align: right }
.riscos { list-style: none; padding: 0; margin: 6px 0 0; display: grid; gap: 6px } .riscos li { border-radius: 8px; padding: 8px 12px; font-size: 13.5px }
.riscos li.bad { background: var(--bad-soft); color: var(--bad) } .riscos li.warn { background: var(--warn-soft); color: var(--warn) } .riscos li.info { background: var(--accent-soft); color: var(--fg) }
/* cores contra a meta: vermelho abaixo, azul na meta, verde acima */
.t.meta, .q.meta { border-left-color: var(--accent) } .st.meta { background: var(--accent-soft); color: var(--accent) }
.pl td.cel.c-bad { box-shadow: inset -3px 0 var(--bad) } .pl td.cel.c-meta { box-shadow: inset -3px 0 var(--accent) } .pl td.cel.c-ok { box-shadow: inset -3px 0 var(--ok) }
.pl td.cel.am.c-bad, .pl td.cel.am.c-ok, .pl td.cel.am.c-meta { box-shadow: inset 3px 0 var(--warn), inset -3px 0 var(--line) }
.pl td.cel.c-bad.am { box-shadow: inset 3px 0 var(--warn), inset -3px 0 var(--bad) } .pl td.cel.c-ok.am { box-shadow: inset 3px 0 var(--warn), inset -3px 0 var(--ok) } .pl td.cel.c-meta.am { box-shadow: inset 3px 0 var(--warn), inset -3px 0 var(--accent) }
.leg-cor { font-size: 12px; color: var(--muted); margin: 4px 0 0; display: flex; gap: 6px 14px; flex-wrap: wrap; align-items: center } .leg-cor i.c { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px }
i.c.bad { background: var(--bad) } i.c.meta { background: var(--accent) } i.c.ok { background: var(--ok) }
.lead { font-size: 15px; color: var(--fg); margin-bottom: 12px }
.stepper { list-style: none; padding: 0; margin: 0 0 14px; display: flex; flex-wrap: wrap; gap: 6px }
.stepper button { font: 600 12.5px var(--f-ui); color: var(--muted); background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 5px 11px 5px 5px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center }
.stepper button span { display: inline-grid; place-items: center; min-width: 20px; height: 20px; border-radius: 999px; background: var(--surface-2); font: 600 11px var(--f-num) }
.stepper .feito button { color: var(--fg) } .stepper .feito button span { background: var(--ok-soft); color: var(--ok) }
.stepper .atual button { background: var(--accent); color: var(--surface); border-color: var(--accent) } .stepper .atual button span { background: var(--surface); color: var(--accent) }
.cards2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 10px; margin-bottom: 10px }
.est { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; background: var(--surface) } .est.sel { border: 2px solid var(--accent) } .est.off { opacity: .72 }
.est h3 { margin-top: 0 } .est dl, .lin { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; margin: 0 0 8px; font-size: 13px } .est dt, .lin dt { color: var(--muted) } .est dd, .lin dd { margin: 0 }
.jorn { display: flex; flex-wrap: wrap; gap: 6px; padding: 0; list-style: none; counter-reset: j } .jorn li { counter-increment: j; background: var(--surface-2); border-radius: 8px; padding: 4px 10px; font-size: 13px } .jorn li::before { content: counter(j) ". "; color: var(--muted); font-family: var(--f-num) }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 380px), 1fr)); gap: 14px } .grid2 > * { min-width: 0 }
.tag { display: inline-block; font-size: 11.5px; font-weight: 600; border-radius: 999px; padding: 1px 8px; background: var(--surface-2); color: var(--muted) }
.tag.ok { background: var(--ok-soft); color: var(--ok) } .tag.warn { background: var(--warn-soft); color: var(--warn) } .tag.meta { background: var(--accent-soft); color: var(--accent) } .tag.hist { background: var(--surface-3); color: var(--fg) } .tag.prem { background: var(--warn-soft); color: var(--warn); border: 1px dashed var(--warn) } .tag.bad { background: var(--bad-soft); color: var(--bad) }
input.falta { border-color: var(--bad); background: var(--bad-soft) }
.ck { display: flex; gap: 8px; align-items: center; font-size: 13px; margin-bottom: 10px }
tr.tot td { font-weight: 700; border-top: 2px solid var(--fg) } tr.forte td { font-weight: 600 } tr.grp td { background: var(--surface-2) }
.diag { font-size: 14px }
.rv { font: inherit; color: inherit; background: none; border: 0; border-bottom: 1px dotted var(--accent); padding: 0; cursor: pointer } .rv:hover { color: var(--accent) }
.rastro { border: 2px solid var(--accent) } .rastro dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; font-size: 13px; margin: 0 0 10px } .rastro dt { color: var(--muted) } .rastro dd { margin: 0 }
.rodape { display: flex; gap: 8px; align-items: center; justify-content: flex-end; flex-wrap: wrap; margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--line) } .rodape .peq { margin-right: auto }
.btn.pri { background: var(--accent); color: var(--surface) }
.campos { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px }
.campo { display: flex; flex-direction: column; gap: 3px; font-size: 12.5px; color: var(--muted) } .campo span { color: var(--fg) } .campo input[type=text] { font: 14px var(--f-ui); padding: 7px 9px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface-2); color: var(--fg); min-width: 260px }
.linha { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end }
.bcdoc { max-width: 900px } .bcdoc h3 { border-top: 1px solid var(--line); padding-top: 10px; margin-top: 16px }
.warn-t { color: var(--warn) }
td input[type=number] { width: 90px }
input[type=range] { width: min(380px, 70vw); vertical-align: middle }
code { font: 12px var(--f-num) }
@media (max-width: 600px) { .campo input[type=text] { min-width: 0 } .stepper button { font-size: 11.5px } }

.q b .st { font: 600 12px var(--f-ui); letter-spacing: 0 } .hoje { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; max-width: none }
td:first-child { white-space: normal; min-width: 170px } td .d { white-space: normal }

table.rec td { vertical-align: top } table.rec tr.off td { color: var(--muted) } table.rec tr.off input.nome, table.rec tr.off select, table.rec tr.off .un { opacity: .55 }
input.nome { font: 13px var(--f-ui); color: var(--fg); background: transparent; border: 1px solid transparent; border-radius: 6px; padding: 5px 6px; width: 220px } input.nome:hover, input.nome:focus { border-color: var(--line); background: var(--surface-2) }
.un { display: inline-flex; gap: 6px; align-items: center; white-space: nowrap }
.x { font: 600 16px var(--f-ui); color: var(--muted); background: none; border: 0; cursor: pointer; padding: 2px 8px; border-radius: 6px } .x:hover { color: var(--bad); background: var(--bad-soft) }
table.rec input[type=checkbox] { width: 18px; height: 18px; margin-top: 6px }

.hist { margin-bottom: 14px } .hist .cards { margin-bottom: 4px }
.st.meta { background: var(--accent-soft); color: var(--accent) }
tr.faixa td { font-size: 11.5px; white-space: normal; color: var(--muted) }
.hcol { background: var(--surface-2); color: var(--muted) }

tr.sel td { background: var(--accent-soft) } .radio { display: inline-flex; gap: 6px; align-items: center; font-weight: 600 }
.destaque { border: 2px solid var(--accent); margin-top: 14px }
.statusc { margin-bottom: 14px } .chk { list-style: none; padding: 0; margin: 8px 0 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 6px 16px; font-size: 13.5px } .chk li span[aria-hidden] { display: inline-block; width: 16px; font-weight: 700 } .chk li.ok span[aria-hidden] { color: var(--ok) } .chk li.no { color: var(--muted) } .chk .d { margin-left: 20px; color: var(--muted) }
.c-ok { color: var(--ok); font-weight: 600 } .c-bad { color: var(--bad); font-weight: 600 } .c-meta { color: var(--accent); font-weight: 600 }
table.gmc td input[type=number] { width: 80px }

.rot { font-weight: 600; margin: 12px 0 6px } .tipos { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 8px }
.tipo { text-align: left; font: inherit; color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; cursor: pointer; display: flex; flex-direction: column; gap: 4px }
.tipo b { font-size: 14px } .tipo span { font-size: 12.5px; color: var(--muted) } .tipo:hover { border-color: var(--accent) } .tipo.on { border: 2px solid var(--accent); background: var(--accent-soft) }
.sep { border: 0; border-top: 1px solid var(--line); margin: 16px 0 }
/* ===== Visual do Growths (mesmo da tela Campanhas e planejamento / Nova campanha), tema azul ===== */
:root { --bg:#f4f7fc; --surface:#ffffff; --surface-2:#f1f5fb; --line:#e1e8f3; --ink:#0f1a33; --muted:#5a6a86; --accent:#1d4ed8; --accent-2:#1e3a8a; --accent-ink:#fff; --accent-soft:#e3ecfd; --accent-rgb:29,78,216;
  --good:#17803d; --good-soft:#dcf3e3; --warn:#9a6700; --warn-soft:#fbefc9; --bad:#b42318; --bad-soft:#fbe1de; --info:#2457a6; --info-soft:#e0eaf9;
  --grad:linear-gradient(120deg,#1e3a8a,#1d4ed8 45%,#0891b2); --brilho:rgba(29,78,216,.22); --raio:14px; color-scheme:light }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#050a18; --surface:#0a1226; --surface-2:#0f1a33; --line:#18264a; --ink:#e7edfa; --muted:#8a9aba; --accent:#3b82f6; --accent-2:#1d4ed8; --accent-soft:#10224a; --accent-rgb:59,130,246;
  --good:#4ade80; --good-soft:#12301f; --warn:#f5b942; --warn-soft:#3a2c0e; --bad:#ff6b6b; --bad-soft:#401719; --info:#7fb0ff; --info-soft:#15284a; --brilho:rgba(37,99,235,.38); color-scheme:dark } }
:root[data-theme="dark"] { --bg:#050a18; --surface:#0a1226; --surface-2:#0f1a33; --line:#18264a; --ink:#e7edfa; --muted:#8a9aba; --accent:#3b82f6; --accent-2:#1d4ed8; --accent-soft:#10224a; --accent-rgb:59,130,246;
  --good:#4ade80; --good-soft:#12301f; --warn:#f5b942; --warn-soft:#3a2c0e; --bad:#ff6b6b; --bad-soft:#401719; --info:#7fb0ff; --info-soft:#15284a; --brilho:rgba(37,99,235,.38); color-scheme:dark }
:root { --fg:var(--ink); --ok:var(--good); --ok-soft:var(--good-soft); --surface-3:var(--surface-2); --f-ui:'Inter','Segoe UI',system-ui,sans-serif; --f-num:'Inter','Segoe UI',system-ui,sans-serif }
body { font:14px/1.5 var(--f-ui); color:var(--ink); background:var(--bg); -webkit-font-smoothing:antialiased }
html.growths body { background:transparent } html.growths .wrap { padding:0; max-width:none }
h1,h2,h3 { letter-spacing:-.01em } h2 { font-size:17px; font-weight:650 } h3 { font-size:15px; font-weight:600 }
/* janela do assistente: cabeçalho com barras de passo, corpo e rodapé */
.wz { background:var(--surface); border:1px solid var(--line); border-radius:16px; overflow:hidden }
.wzh { padding:20px 24px 14px; border-bottom:1px solid var(--line) } .wzh h2 { margin:0 0 14px; font-size:20px }
.wzp { display:grid; grid-template-columns:repeat(7, minmax(0, 1fr)); gap:10px 8px }
.wzp button { all:unset; display:flex; flex-direction:column; gap:6px; font-size:12px; color:var(--muted); font-weight:600; cursor:pointer; line-height:1.3 }
.wzp button i { height:5px; border-radius:9px; background:var(--line) } .wzp button:hover span { color:var(--accent) } .wzp button:focus-visible { outline:2px solid var(--accent); outline-offset:3px; border-radius:4px }
.wzp button.ok { color:var(--good) } .wzp button.ok i { background:var(--good); box-shadow:0 0 10px rgba(47,245,143,.35) }
.wzp button.at { color:var(--ink) } .wzp button.at i { background:var(--grad); box-shadow:0 0 12px var(--brilho) }
.wz-resumo { display:block; margin-top:10px; font-size:12.5px }
.wzb { padding:20px 24px; display:flex; flex-direction:column; gap:14px } .wzb > h3:first-child { margin:0; font-size:17px }
.wzb p.lead { margin:0; color:var(--muted); font-size:13.5px; max-width:none }

<header style="margin-bottom:14px"><h1>Planejamento de campanha avançado <span class="exemplo">dados fictícios</span></h1>
<p class="muted">Módulo em protótipo (fase 1): da estratégia ao cockpit, com o Business Case no meio. Primeiro caso: Captação → Evento → Venda. Roda só no seu navegador, com o motor isolado e dados de exemplo. Nada é gravado no Growths. <button type="button" class="btn" data-zera style="margin-left:6px">Recomeçar o exemplo</button></p></header>
<nav id="nav" aria-label="Passos"></nav><main id="app"></main></div>
<script>/* Growths — motor do Business Case de campanha (fase 1, protótipo isolado).
   Funções puras: recebem premissas, devolvem números, limites, alertas e a origem de cada valor.
   Roda no navegador e no Node (testes). Nenhuma chamada a banco ou rede. */
(function (raiz) {
  'use strict';
  const ORIGENS = { real_conc: 'Real conciliado', real_nconc: 'Real não conciliado', usuario: 'Informado pelo usuário', historico: 'Estimativa histórica', premissa: 'Premissa simulada' };
  const num = v => (v == null || v === '' || !isFinite(Number(v))) ? null : Number(v);
  const div = (a, b) => (a == null || b == null || !isFinite(a) || !isFinite(b) || b === 0) ? null : a / b;
  const r2 = v => v == null ? null : Math.round(v * 100) / 100;
  const val = c => c && typeof c === 'object' && 'v' in c ? num(c.v) : num(c); // um campo pode vir como { v, origem }
  const org = c => c && typeof c === 'object' && 'origem' in c ? c.origem : null;

  /* ---------- validação de premissas: taxas de 0 a 100%, custos não negativos, nulos sinalizados ---------- */
  function valida(p) {
    const erros = [], avisos = [], taxa = (nome, v, obrig) => { if (v == null) { if (obrig) erros.push({ campo: nome, msg: 'sem valor' }); return; } if (v < 0 || v > 100) erros.push({ campo: nome, msg: 'taxa fora de 0% a 100%' }); };
    const custo = (nome, v) => { if (v != null && v < 0) erros.push({ campo: nome, msg: 'custo negativo' }); };
    const pr = p.produto || {};
    if (!(val(pr.preco) > 0)) erros.push({ campo: 'produto.preco', msg: 'preço precisa ser maior que zero' });
    ['desconto', 'tributos', 'taxaPlataforma', 'comissao', 'reembolso', 'chargeback', 'inadimplencia'].forEach(k => taxa('produto.' + k, val(pr[k]), false));
    ['taxaTransacao', 'entrega', 'suporte', 'infra'].forEach(k => custo('produto.' + k, val(pr[k])));
    const f = p.funil || {};
    ['ctr', 'cliqueVisita', 'convPagina', 'inscricao', 'comparecimento', 'convPresentes', 'convAusentes', 'pctNovos'].forEach(k => taxa('funil.' + k, val(f[k]), false));
    (p.recursos || []).forEach((r, i) => custo(`recursos[${i}].valor`, val(r.valor)));
    return { ok: !erros.length, erros, avisos };
  }

  /* ---------- 1. margem de contribuição unitária antes da aquisição ---------- */
  // receita líquida unitária: preço − desconto − tributos − taxas da plataforma − taxa fixa de transação − comissões − perdas (reembolso, chargeback, inadimplência)
  // custos variáveis não ligados à aquisição: entrega, suporte incremental, infraestrutura por venda
  // um campo sem valor NÃO vira zero: entra em `faltando` e a margem fica marcada como incompleta
  function margem(produto) {
    const pr = produto || {}, faltando = [], campos = ['preco', 'desconto', 'tributos', 'taxaPlataforma', 'taxaTransacao', 'comissao', 'reembolso', 'chargeback', 'inadimplencia', 'entrega', 'suporte', 'infra'];
    const v = {}; campos.forEach(k => { v[k] = val(pr[k]); if (v[k] == null) faltando.push(k); });
    const z = k => v[k] == null ? 0 : v[k];
    const precoLiq = z('preco') * (1 - z('desconto') / 100);                          // preço depois do desconto
    const perdas = precoLiq * (z('reembolso') + z('chargeback') + z('inadimplencia')) / 100; // o que volta ou não entra
    const tributos = (precoLiq - perdas) * z('tributos') / 100;                         // tributo sobre o que fica
    const plataforma = (precoLiq - perdas) * z('taxaPlataforma') / 100 + z('taxaTransacao');
    const comissao = (precoLiq - perdas) * z('comissao') / 100;
    const receitaLiquida = precoLiq - perdas - tributos - plataforma - comissao;
    const variaveis = z('entrega') + z('suporte') + z('infra');
    const mc = receitaLiquida - variaveis;
    const origem = {}; campos.forEach(k => origem[k] = org(pr[k]) || (v[k] == null ? null : 'usuario'));
    const estimados = campos.filter(k => ['historico', 'premissa'].includes(origem[k]));
    return { precoLiq, perdas, tributos, plataforma, comissao, receitaLiquida, variaveis, mc, mcPct: div(mc, receitaLiquida), faltando, completa: !faltando.length, estimados, origem };
  }

  /* ---------- 2. funil Captação → Evento → Venda, a partir da verba de mídia ---------- */
  // verba → impressões (CPM) → cliques (CTR) → visitas → leads pagos; + leads dos canais sem mídia
  // leads → inscritos (opcional) → participantes; compras = participantes × conv. presentes + ausentes × conv. ausentes (grupos que não se sobrepõem)
  // rendimento decrescente: o CPM sobe quando a verba passa da referência (elasticidade)
  function funil(p, verba) {
    const f = p.funil || {}, t = k => (val(f[k]) == null ? null : val(f[k]) / 100);
    const ref = val(f.verbaRef) || verba || 1, el = val(f.elasticidade) || 0;
    const cpm = val(f.cpm) * Math.pow(Math.max(verba, 1) / ref, el);
    const imp = verba > 0 && cpm > 0 ? verba / cpm * 1000 : 0, cliques = imp * (t('ctr') || 0), visitas = cliques * (t('cliqueVisita') == null ? 1 : t('cliqueVisita'));
    const leadsPagos = visitas * (t('convPagina') || 0), leadsOrg = (p.canais || []).filter(c => c.tipo !== 'pago').reduce((s, c) => s + (val(c.leads) || 0), 0);
    const leads = leadsPagos + leadsOrg, inscritos = leads * (t('inscricao') == null ? 1 : t('inscricao')), part = inscritos * (t('comparecimento') || 0), aus = inscritos - part;
    const vPres = part * (t('convPresentes') || 0), vAus = aus * (t('convAusentes') || 0), vendas = vPres + vAus, novos = vendas * (t('pctNovos') == null ? 1 : t('pctNovos'));
    return { verba, cpm, imp, cliques, visitas, leadsPagos, leadsOrg, leads, inscritos, part, aus, vPres, vAus, vendas, novos, convLeadNovo: div(novos, leads) };
  }

  /* ---------- 3. custos da campanha fora a mídia, classificados ---------- */
  // tipos: disp_sem (já existe, sem desembolso), disp_aloc (já existe, mas precisa alocar: entra como custo de alocação),
  // fixo (incremental fixo), var_lead (por lead), var_venda (por venda), capacidade (investimento em nova capacidade)
  function custos(p, F) {
    // r.usar === false: recurso fora desta campanha (custo zero, não some da lista). r.unidade === 'pct' (só por venda): % do valor de cada venda
    const precoVenda = (val(p.produto && p.produto.preco) || 0) * (1 - (val(p.produto && p.produto.desconto) || 0) / 100);
    const linhas = (p.recursos || []).map(r => { const pct = r.tipo === 'var_venda' && r.unidade === 'pct', v = pct ? (val(r.valor) || 0) / 100 * precoVenda : (val(r.valor) || 0), q = r.tipo === 'var_lead' ? F.leads : r.tipo === 'var_venda' ? F.vendas : 1;
      const total = r.usar === false || r.tipo === 'disp_sem' ? 0 : v * q, caixa = ['fixo', 'var_lead', 'var_venda', 'capacidade'].includes(r.tipo); // alocação de quem já é pago não sai do caixa de novo
      return { ...r, valor: v, valorInformado: val(r.valor), qtd: q, total, desembolso: caixa ? total : 0 }; });
    const api = (p.canais || []).filter(c => c.tipo === 'api').reduce((s, c) => s + (val(c.leads) || 0) * (val(c.custoLead) || 0), 0);
    if (api) linhas.push({ nome: 'Disparos da API (por lead)', tipo: 'var_lead', valor: null, qtd: null, total: api, desembolso: api });
    const total = linhas.reduce((s, x) => s + x.total, 0), desembolso = linhas.reduce((s, x) => s + x.desembolso, 0);
    const semCapacidade = (p.recursos || []).filter(r => r.usar !== false && r.capacidade != null && val(r.capacidade) < (r.tipo === 'var_venda' ? F.vendas : r.tipo === 'var_lead' ? F.leads : 0));
    return { linhas, total, desembolso, semCapacidade };
  }

  /* ---------- 4. resultado da campanha para uma verba ---------- */
  function resultado(p, verba) {
    const M = margem(p.produto), F = funil(p, verba), C = custos(p, F), o = p.ofertas || {};
    const ticketExtra = ['bump', 'upsell'].reduce((s, k) => s + (o[k] && o[k].tem ? (val(o[k].aceite) || 0) / 100 * (val(o[k].mcUnit) == null ? 0 : val(o[k].mcUnit)) : 0), 0);
    const mcVenda = M.mc + ticketExtra, mcTotal = F.vendas * mcVenda; // contribuição projetada antes da aquisição
    const recLiq = F.vendas * (M.receitaLiquida + ['bump', 'upsell'].reduce((s, k) => s + (o[k] && o[k].tem ? (val(o[k].aceite) || 0) / 100 * (val(o[k].recLiqUnit) || 0) : 0), 0));
    const investimento = verba + C.total, residual = mcTotal - investimento; // contribuição que sobra depois de pagar a campanha (não é lucro líquido)
    return { M, F, C, verba, mcVenda, mcTotal, recLiq, investimento, residual, cacMidia: div(verba, F.novos), cacTotal: div(investimento, F.novos), cpl: div(verba, F.leadsPagos), cplTotal: div(verba + C.total, F.leads), cpa: div(verba, F.vendas), roas: div(F.vendas * (val(p.produto.preco) || 0), verba), roasEquilibrio: div(val(p.produto.preco) || 0, mcVenda) };
  }

  /* ---------- busca numérica (bisseção) com checagem de convergência ---------- */
  function bissecao(fn, lo, hi, tol = 1, maxIt = 80) {
    let flo = fn(lo), fhi = fn(hi), it = 0;
    if (flo == null || fhi == null) return { x: null, convergiu: false, it, motivo: 'função sem valor' };
    if (flo < 0) return { x: null, convergiu: false, it, motivo: 'nem com verba mínima o limite é atendido' };
    if (fhi >= 0) return { x: hi, convergiu: true, it, motivo: 'limite acima do teto de busca' };
    while (hi - lo > tol && it < maxIt) { const mid = (lo + hi) / 2, fm = fn(mid); if (fm >= 0) lo = mid; else hi = mid; it++; }
    return { x: lo, convergiu: hi - lo <= tol, it, motivo: hi - lo <= tol ? null : 'não convergiu' };
  }

  // verba que deixa a maior contribuição residual (busca em grade e depois refina por seção áurea)
  function picoResidual(p, teto) {
    let melhor = 0, vm = -Infinity; const passos = 60;
    for (let i = 0; i <= passos; i++) { const x = teto * i / passos, v = resultado(p, x).residual; if (v > vm) { vm = v; melhor = x; } }
    let a = Math.max(0, melhor - teto / passos), b = Math.min(teto, melhor + teto / passos); const g = (Math.sqrt(5) - 1) / 2;
    for (let i = 0; i < 40 && b - a > 1; i++) { const c = b - g * (b - a), d = a + g * (b - a); if (resultado(p, c).residual >= resultado(p, d).residual) b = d; else a = c; }
    const x = (a + b) / 2; return { x, residual: resultado(p, x).residual };
  }

  /* ---------- 5. caixa dia a dia ---------- */
  // saídas: mídia espalhada nos dias de captação, custos fixos no início, variáveis por lead na captação e por venda no carrinho
  // entradas: vendas no carrinho; à vista entra após o repasse; parcelado entra em parcelas mensais, ou tudo antecipado com taxa
  function caixa(p, verba) {
    if (!p.caixa || val(p.caixa.saldo) == null) return { semDado: true, serie: [], min: null, folga: null, payback: null, minDia: null }; // sem saldo informado não se calcula caixa
    const R = resultado(p, verba), cx = p.caixa || {}, d = p.datas || { capA: 0, capB: 20, carA: 26, carB: 32 }, n = Math.max(d.carB + 400, 60), fluxo = new Float64Array(n + 1);
    const capDias = d.capB - d.capA + 1, carDias = d.carB - d.carA + 1;
    for (let i = d.capA; i <= d.capB; i++) fluxo[i] -= (verba + R.C.linhas.filter(x => x.tipo === 'var_lead').reduce((s, x) => s + x.desembolso, 0)) / capDias;
    fluxo[d.capA] -= R.C.linhas.filter(x => ['fixo', 'capacidade'].includes(x.tipo)).reduce((s, x) => s + x.desembolso, 0);
    const pctParc = (val(cx.pctParcelado) || 0) / 100, parcelas = Math.max(1, val(cx.parcelas) || 1), antecipa = !!cx.antecipar, taxaAnt = (val(cx.taxaAntecipacao) || 0) / 100, repasse = val(cx.repasseDias) || 0;
    for (let i = d.carA; i <= d.carB; i++) {
      const recDia = R.recLiq / carDias, varVenda = R.C.linhas.filter(x => x.tipo === 'var_venda').reduce((s, x) => s + x.desembolso, 0) / carDias;
      fluxo[i] -= varVenda + R.F.vendas * R.M.variaveis / carDias; // entrega e suporte saem quando vende
      const vista = recDia * (1 - pctParc), parc = recDia * pctParc;
      if (i + repasse <= n) fluxo[i + repasse] += vista; // simplificação: entra a receita líquida (tributos e comissões já descontados)
      if (antecipa) { if (i + repasse <= n) fluxo[i + repasse] += parc * (1 - taxaAnt * (parcelas - 1) / 2); }
      else for (let k = 0; k < parcelas; k++) { const j = i + repasse + 30 * k; if (j <= n) fluxo[j] += parc / parcelas; }
    }
    (cx.programados || []).forEach(x => { if (x.dia <= n) fluxo[x.dia] -= val(x.valor) || 0; }); // desembolsos já programados no Financeiro
    let s = val(cx.saldo) || 0, min = Infinity, diaMin = 0, payback = null, acumCamp = 0; const serie = [];
    for (let i = 0; i <= n; i++) { s += fluxo[i]; serie.push(s); if (s < min) { min = s; diaMin = i; } acumCamp += fluxo[i] + ((cx.programados || []).filter(x => x.dia === i).reduce((a, x) => a + (val(x.valor) || 0), 0)); if (payback == null && i > d.capA && acumCamp >= 0 && i >= d.carA) payback = i - d.capA; }
    return { serie, min, diaMin, payback, reserva: val(cx.reserva) || 0, folga: min - (val(cx.reserva) || 0) };
  }

  /* ---------- 6. limites: econômico, financiável, autorizado; CAC e CPL ---------- */
  function limites(p) {
    const resMin = val(p.residualMinimo) || 0, teto = val(p.tetoBusca) || 1e6;
    // a) pela meta de vendas (volume fixo): MC da meta − residual − demais custos = verba máxima; sem circularidade
    const vendasMeta = val(p.metaVendas), base = resultado(p, val(p.verbaPlanejada) || 0);
    // b) econômico pelo funil: maior verba em que a contribuição residual ainda cobre o mínimo (o volume cresce com a verba; resolve por bisseção)
    // a contribuição residual sobe e depois cai com a verba (cada lead a mais custa mais): acha o pico e procura o limite à direita dele
    const pico = picoResidual(p, teto), eco = pico.residual < resMin ? { x: null, convergiu: false, motivo: 'nem no melhor ponto a contribuição residual chega ao mínimo', pico } : { ...bissecao(x => resultado(p, x).residual - resMin, pico.x, teto), pico };
    // c) financiável: maior verba em que o caixa nunca fica abaixo da reserva
    const fin = !p.caixa || val(p.caixa.saldo) == null ? { x: teto, convergiu: true, semDado: true } : bissecao(x => caixa(p, x).folga, 0, teto);
    // d) operacional: vendas não podem passar da capacidade de entrega
    const capVendas = val(p.capacidadeVendas), op = capVendas == null ? { x: teto, convergiu: true, semDado: true } : bissecao(x => capVendas - resultado(p, x).F.vendas, 0, teto);
    // e) orçamento: não pode usar o que já foi realizado ou está comprometido com outras campanhas
    const disp = val(p.orcamentoDisponivel), orc = disp == null ? { x: teto, convergiu: true, semDado: true } : bissecao(x => disp - resultado(p, x).investimento, 0, teto);
    const lims = [['econômico', eco.x], ['caixa', fin.x], ['capacidade de entrega', op.x], ['orçamento disponível', orc.x]].filter((l, i) => !(i === 1 && fin.semDado) && !(i === 2 && capVendas == null) && !(i === 3 && disp == null)), algumNulo = lims.some(l => l[1] == null);
    const autorizado = algumNulo ? null : lims.length ? Math.min(...lims.map(l => l[1])) : teto;
    const quem = autorizado == null ? (lims.find(l => l[1] == null) || ['nenhum'])[0] : (lims.find(l => l[1] === autorizado) || ['sem limite informado'])[0];

    let meta = null;

      const M = margem(p.produto), mcVenda = base.mcVenda, mcMeta = vendasMeta * mcVenda;
      const jaBate = resultado(p, 0).F.vendas >= vendasMeta, verbaParaMeta = jaBate ? { x: 0 } : bissecao(x => resultado(p, x).F.vendas - vendasMeta >= 0 ? -1 : 1, 0, teto); // menor verba que atinge a meta
      const atinge = verbaParaMeta.x != null && resultado(p, verbaParaMeta.x + 1).F.vendas >= vendasMeta - 1e-6, vNec = !atinge ? null : verbaParaMeta.x + (jaBate ? 0 : 1), Rm = vNec == null ? null : resultado(p, vNec);
      const demais = Rm ? Rm.C.total : null, verbaMax = demais == null ? null : mcMeta - resMin - demais;
      meta = { vendasMeta, mcMeta, demais, verbaMax, verbaNecessaria: vNec, viavel: vNec != null && verbaMax != null && vNec <= verbaMax, cacMax: Rm ? div(verbaMax, Rm.F.novos) : null, cplMax: Rm ? div(verbaMax, Rm.F.leadsPagos) : null, R: Rm };
    }
    const novosA = Ra ? Ra.F.novos : null, conv = Ra ? Ra.F.convLeadNovo : null;

function grafCaixa(series, reserva, dias) {

    <line x1="${x0}" x2="${x1}" y1="${Y(reserva)}" y2="${Y(reserva)}" stroke="var(--bad)" stroke-dasharray="4 4"/><text x="${x1}" y="${Y(reserva) - 4}" text-anchor="end" font-size="11" fill="var(--bad)">reserva mínima</text>
    ${series.map(s => `<polyline fill="none" stroke="${s.cor}" stroke-width="2" ${s.tr ? 'stroke-dasharray="5 4"' : ''} points="${s.d.slice(0, dias).map((v, i) => `${X(i)},${Y(v)}`).join(' ')}"/>`).join('')}
    ${[0, 30, 60, 90, 120].filter(d => d < dias).map(d => `<text x="${X(d)}" y="${H - 10}" text-anchor="middle" font-size="11" fill="var(--muted)">dia ${d}</text>`).join('')}</svg>
    <div class="leg">${series.map(s => `<span><i style="background:${s.cor}"></i>${s.n}</span>`).join('')}</div>`;
}
